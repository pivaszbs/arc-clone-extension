<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http:; media-src 'self' http:; object-src 'none'; base-uri 'none'">
  <title>Anime Study</title>
  <link rel="stylesheet" href="tv.css">
  <script defer src="tv.js"></script>
</head>
<body>
  <main id="library">
    <header><img src="icon.png" alt=""><h1 id="title">Anime Study</h1><button id="library-diagnostics">Diagnostics</button></header>
    <form id="connect">
      <label for="address">Address from your Mac</label>
      <input id="address" inputmode="url" type="url" placeholder="http://…" autocomplete="off" required>
      <button>Connect</button>
    </form>
    <p id="library-status" role="status"></p>
    <button id="change" hidden>Change library</button>
    <ol id="episodes" aria-label="Episodes"></ol>
  </main>
  <section id="player" hidden aria-label="Episode player">
    <video id="video" playsinline preload="metadata"></video>
    <button id="caption" hidden aria-label="Study this subtitle"></button>
    <p id="playback-status" role="status" hidden></p>
    <div id="controls">
      <div id="episode-title"></div>
      <div id="skip-controls" hidden>
        <button id="skip"></button><span id="countdown"></span><button id="keep" hidden>Keep watching</button>
      </div>
      <div class="progress-row"><progress id="progress" max="1" value="0"></progress><span id="clock"></span></div>
      <div class="actions">
        <button id="back">Episodes</button><button id="play">Play</button>
        <button id="rewind">−10 sec</button><button id="forward">+10 sec</button>
        <button id="learn">Learn</button><button id="next">Next episode</button>
        <button id="player-diagnostics">Diagnostics</button>
      </div>
      <div id="learning" hidden>
        <span>Pause to study</span><button id="frequency"></button>
        <button id="replay" hidden>Replay line</button><button id="continue" hidden>Continue</button>
      </div>
    </div>
  </section>
  <dialog id="diagnostics" aria-labelledby="diagnostics-title">
    <h2 id="diagnostics-title">Diagnostics</h2>
    <pre id="diagnostics-report" tabindex="0" aria-label="Playback and connection report"></pre>
    <form method="dialog"><button autofocus>Close diagnostics</button></form>
  </dialog>
</body>
</html>
